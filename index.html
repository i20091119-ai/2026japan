<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>초등발명반 출석 체크</title>
<style>
  :root {
    --bg: #F6F7F9;
    --card: #FFFFFF;
    --ink: #1E2530;
    --sub: #6B7482;
    --line: #E3E6EB;
    --boy: #2E6BB4;
    --boy-soft: #EAF1F9;
    --girl: #C2527E;
    --girl-soft: #FAEEF3;
    --done: #178A5C;
    --done-soft: #E8F5EF;
    --chip-bg: #FFFFFF;
    --chip-on: #1E2530;
    --chip-on-text: #FFFFFF;
    --shadow: 0 1px 3px rgba(20, 28, 40, 0.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14181E;
      --card: #1D232C;
      --ink: #E8ECF1;
      --sub: #97A0AD;
      --line: #2C333E;
      --boy: #6FA5DE;
      --boy-soft: #1E2A3A;
      --girl: #DE86AB;
      --girl-soft: #33222B;
      --done: #4CC392;
      --done-soft: #1B2F27;
      --chip-bg: #1D232C;
      --chip-on: #E8ECF1;
      --chip-on-text: #14181E;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14181E;
    --card: #1D232C;
    --ink: #E8ECF1;
    --sub: #97A0AD;
    --line: #2C333E;
    --boy: #6FA5DE;
    --boy-soft: #1E2A3A;
    --girl: #DE86AB;
    --girl-soft: #33222B;
    --done: #4CC392;
    --done-soft: #1B2F27;
    --chip-bg: #1D232C;
    --chip-on: #E8ECF1;
    --chip-on-text: #14181E;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 90px;
  }

  .top {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: 12px 16px 10px;
  }
  .top-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    max-width: 640px;
    margin: 0 auto;
  }
  h1 {
    font-size: 17px;
    font-weight: 800;
    margin: 0;
    letter-spacing: -0.01em;
  }
  h1 small {
    font-size: 12px;
    font-weight: 500;
    color: var(--sub);
    margin-left: 6px;
  }
  .count {
    font-size: 15px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--done);
    white-space: nowrap;
  }
  .count .total { color: var(--sub); font-weight: 600; }
  .bar {
    max-width: 640px;
    margin: 8px auto 10px;
    height: 6px;
    border-radius: 3px;
    background: var(--line);
    overflow: hidden;
  }
  .bar i {
    display: block;
    height: 100%;
    width: 0;
    background: var(--done);
    border-radius: 3px;
    transition: width 0.25s ease;
  }
  .controls {
    display: flex;
    gap: 6px;
    max-width: 640px;
    margin: 0 auto;
    align-items: center;
  }
  .chips { display: flex; gap: 6px; flex: 1; }
  .chip {
    border: 1px solid var(--line);
    background: var(--chip-bg);
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .chip.on {
    background: var(--chip-on);
    color: var(--chip-on-text);
    border-color: var(--chip-on);
  }
  #q {
    width: 84px;
    min-width: 0;
    border: 1px solid var(--line);
    background: var(--chip-bg);
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 999px;
    outline: none;
  }
  #q:focus { border-color: var(--sub); }
  #q::placeholder { color: var(--sub); }

  main { max-width: 640px; margin: 0 auto; padding: 4px 16px 16px; }

  .room-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin: 18px 2px 8px;
  }
  .room-num {
    font-size: 20px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
  }
  .room-head.boy .room-num { color: var(--boy); }
  .room-head.girl .room-num { color: var(--girl); }
  .room-meta { font-size: 12px; color: var(--sub); font-weight: 500; }
  .room-count {
    margin-left: auto;
    font-size: 12px;
    font-weight: 700;
    color: var(--sub);
    font-variant-numeric: tabular-nums;
  }
  .room-count.full { color: var(--done); }

  .card {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 13px 14px;
    margin-bottom: 8px;
    cursor: pointer;
    font: inherit;
    color: var(--ink);
    box-shadow: var(--shadow);
    -webkit-tap-highlight-color: transparent;
  }
  .card:active { transform: scale(0.99); }
  .card:focus-visible { outline: 2px solid var(--boy); outline-offset: 2px; }
  .card.checked {
    background: var(--done-soft);
    border-color: var(--done);
  }
  .tick {
    flex: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card.boy .tick { border-color: var(--boy); background: var(--boy-soft); }
  .card.girl .tick { border-color: var(--girl); background: var(--girl-soft); }
  .card.checked .tick { border-color: var(--done); background: var(--done); }
  .tick svg { display: none; }
  .card.checked .tick svg { display: block; }

  .info { flex: 1; min-width: 0; }
  .name { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  .card.checked .name { color: var(--done); }
  .detail { font-size: 12.5px; color: var(--sub); margin-top: 2px; }
  .badge {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 4px;
    margin-left: 5px;
    vertical-align: 1px;
  }
  .badge.mixed { background: var(--boy-soft); color: var(--boy); }
  .time {
    flex: none;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--done);
    font-variant-numeric: tabular-nums;
  }

  .empty {
    text-align: center;
    color: var(--sub);
    font-size: 14px;
    padding: 48px 0;
  }

  .foot {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--bg);
    border-top: 1px solid var(--line);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  }
  .foot-in {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .missing {
    flex: 1;
    font-size: 12.5px;
    color: var(--sub);
    line-height: 1.45;
    overflow: hidden;
  }
  .missing b { color: var(--ink); font-weight: 700; }
  .missing.done-all { color: var(--done); font-weight: 700; font-size: 14px; }
  #reset {
    flex: none;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--sub);
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
  }
  #reset:focus-visible { outline: 2px solid var(--boy); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    .bar i { transition: none; }
    .card:active { transform: none; }
  }
</style>

<header class="top">
  <div class="top-row">
    <h1>초등발명반 출석 체크<small>해외체험학습 8/10~8/12 · 1호차</small></h1>
    <div class="count"><span id="n">0</span><span class="total">/<span id="t">0</span></span></div>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="controls">
    <div class="chips" id="chips">
      <button class="chip on" data-f="all">전체</button>
      <button class="chip" data-f="todo">미확인</button>
      <button class="chip" data-f="boy">남</button>
      <button class="chip" data-f="girl">여</button>
    </div>
    <input id="q" type="search" placeholder="이름 검색" autocomplete="off">
  </div>
</header>

<main id="list"></main>

<footer class="foot">
  <div class="foot-in">
    <div class="missing" id="missing"></div>
    <button id="reset">전체 해제</button>
  </div>
</footer>

<script>
  // [이름, 학교, 학년, 방번호, 성별, 룸메이트가 수학과학반인 경우 그 이름]
  const STUDENTS = [
    ["김강현", "창녕초", "초5", 705, "boy", null],
    ["김범준", "창녕초", "초5", 705, "boy", null],
    ["우주원", "창녕초", "초5", 707, "boy", "조정민"],
    ["서진",   "창녕초", "초6", 709, "boy", null],
    ["조찬우", "창녕초", "초6", 709, "boy", null],
    ["황현종", "창녕초", "초6", 711, "boy", null],
    ["빈서진", "창녕초", "초6", 711, "boy", null],
    ["함진우", "창녕초", "초6", 713, "boy", "김민찬"],
    ["정우빈", "명덕초", "초6", 715, "boy", null],
    ["최승빈", "명덕초", "초6", 715, "boy", null],
    ["황태준", "명덕초", "초6", 721, "boy", "김민재"],
    ["김세은", "창녕초", "초5", 801, "girl", null],
    ["김연아", "창녕초", "초5", 801, "girl", null],
    ["강다영", "남지초", "초6", 807, "girl", null],
    ["박윤진", "남지초", "초6", 807, "girl", null],
    ["김지우", "창녕초", "초6", 809, "girl", null],
    ["임현서", "창녕초", "초6", 809, "girl", null],
    ["박서율", "이방초", "초6", 811, "girl", "나연서"],
    ["최윤서", "창녕초", "초6", 813, "girl", null],
    ["김연지", "영산초", "초6", 813, "girl", null],
  ];

  const KEY = "invention-attendance-v1";
  let state = {};
  try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { state = {}; }
  let filter = "all";
  let query = "";

  const save = () => localStorage.setItem(KEY, JSON.stringify(state));
  const fmt = (ts) => {
    const d = new Date(ts);
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  };

  const listEl = document.getElementById("list");

  function render() {
    const visible = STUDENTS.filter(([name, , , , sex]) => {
      if (query && !name.includes(query)) return false;
      if (filter === "todo") return !state[name];
      if (filter === "boy" || filter === "girl") return sex === filter;
      return true;
    });

    listEl.innerHTML = "";
    if (!visible.length) {
      listEl.innerHTML = '<div class="empty">해당하는 학생이 없습니다</div>';
    }

    let currentRoom = null;
    visible.forEach(([name, school, grade, room, sex, roommate]) => {
      if (room !== currentRoom) {
        currentRoom = room;
        const roomStudents = STUDENTS.filter((s) => s[3] === room);
        const done = roomStudents.filter((s) => state[s[0]]).length;
        const head = document.createElement("div");
        head.className = "room-head " + sex;
        head.innerHTML =
          '<span class="room-num">' + room + "호</span>" +
          '<span class="room-meta">' + (sex === "boy" ? "7층 · 남" : "8층 · 여") + "</span>" +
          '<span class="room-count' + (done === roomStudents.length ? " full" : "") + '">' +
          done + "/" + roomStudents.length + "</span>";
        listEl.appendChild(head);
      }

      const card = document.createElement("button");
      card.type = "button";
      card.className = "card " + sex + (state[name] ? " checked" : "");
      card.setAttribute("aria-pressed", state[name] ? "true" : "false");
      card.innerHTML =
        '<span class="tick"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M2.5 7.5L5.5 10.5L11.5 3.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>' +
        '<span class="info"><span class="name">' + name + "</span>" +
        (roommate ? '<span class="badge mixed">룸메이트 ' + roommate + '(수학과학반)</span>' : "") +
        '<div class="detail">' + school + " · " + grade + " · " + room + "호</div></span>" +
        (state[name] ? '<span class="time">' + fmt(state[name]) + "</span>" : "");
      card.addEventListener("click", () => {
        if (state[name]) delete state[name];
        else state[name] = Date.now();
        save();
        render();
      });
      listEl.appendChild(card);
    });

    const done = STUDENTS.filter((s) => state[s[0]]).length;
    document.getElementById("n").textContent = done;
    document.getElementById("t").textContent = STUDENTS.length;
    document.getElementById("bar").style.width = (done / STUDENTS.length) * 100 + "%";

    const missingEl = document.getElementById("missing");
    const missing = STUDENTS.filter((s) => !state[s[0]]).map((s) => s[0]);
    if (!missing.length) {
      missingEl.className = "missing done-all";
      missingEl.textContent = "전원 확인 완료 ✓";
    } else {
      missingEl.className = "missing";
      missingEl.innerHTML = "<b>미확인 " + missing.length + "명</b> · " + missing.join(", ");
    }
  }

  document.getElementById("chips").addEventListener("click", (e) => {
    const btn = e.target.closest(".chip");
    if (!btn) return;
    filter = btn.dataset.f;
    document.querySelectorAll(".chip").forEach((c) => c.classList.toggle("on", c === btn));
    render();
  });

  document.getElementById("q").addEventListener("input", (e) => {
    query = e.target.value.trim();
    render();
  });

  document.getElementById("reset").addEventListener("click", () => {
    if (confirm("모든 체크를 해제할까요?")) {
      state = {};
      save();
      render();
    }
  });

  render();
</script>
