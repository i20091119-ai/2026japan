<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="claude:viewport-fit-sides" content="cover">
<title>마피아 뽑기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* 레이아웃: 밤의 한 화면 — 위에 참가자 7칸, 가운데 큰 시작 버튼, 결과는 그 자리에 크게 */
  :root {
    color-scheme: dark;
    --night: #12131C;
    --panel: #1C1E2B;
    --line: #2E3144;
    --ink: #ECEAF2;
    --dim: #8E90A6;
    --blood: #D8324A;
    --blood-soft: #3A1620;
    --display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--night);
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    padding-block: 24px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main {
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { font-family: var(--display); font-weight: 400; font-size: 30px; margin: 0; letter-spacing: 0.02em; }
  .rule { color: var(--dim); font-size: 13px; white-space: nowrap; }
  .rule b { color: var(--blood); font-weight: 700; }

  .players { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .player {
    display: flex; align-items: center; gap: 8px;
    min-width: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 4px 10px;
    transition: border-color .2s, background .2s;
  }
  .player:last-child { grid-column: 1 / -1; }
  .player .no { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; flex: none; }
  .player input {
    flex: 1; min-width: 0;
    background: none; border: 0; color: var(--ink);
    font: inherit; font-weight: 500; padding: 8px 0;
  }
  .player input:focus { outline: none; }
  .player:focus-within { border-color: var(--dim); }
  .player.flash { border-color: var(--dim); background: #262939; }
  .player.mafia { border-color: var(--blood); background: var(--blood-soft); }
  .player.mafia .no { color: var(--blood); }
  .player .tag { display: none; font-size: 11px; font-weight: 700; color: var(--blood); flex: none; }
  .player.mafia .tag { display: inline; }

  .stage {
    min-height: 210px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    border: 1px dashed var(--line);
    border-radius: 16px;
    padding: 24px 16px;
    text-align: center;
  }
  .stage.shown { border: 1px solid var(--blood); background: var(--blood-soft); }
  .stage .label { color: var(--dim); font-size: 13px; letter-spacing: 0.12em; }
  .stage.shown .label { color: var(--blood); font-weight: 700; }
  .names { display: flex; flex-direction: column; gap: 4px; }
  .names span {
    font-family: var(--display); font-size: 44px; line-height: 1.15;
    overflow-wrap: anywhere;
  }
  .hint { color: var(--dim); font-size: 14px; margin: 0; }

  .actions { display: flex; gap: 8px; }
  button {
    font: inherit; cursor: pointer; border-radius: 12px;
    -webkit-tap-highlight-color: transparent;
  }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #start {
    flex: 1;
    background: var(--blood); color: #fff; border: 0;
    font-family: var(--display); font-size: 24px; letter-spacing: 0.06em;
    padding: 18px;
  }
  #start:disabled { opacity: .5; cursor: default; }
  #hide {
    flex: none;
    background: none; color: var(--ink); border: 1px solid var(--line);
    font-weight: 500; padding: 0 20px;
  }
</style>

<main>
  <header>
    <h1>마피아 뽑기</h1>
    <span class="rule">7명 중 <b>마피아 2명</b></span>
  </header>

  <section class="players" id="players" aria-label="참가자 이름"></section>

  <section class="stage" id="stage" aria-live="polite">
    <span class="label" id="label">밤이 오기 전</span>
    <div class="names" id="names" hidden></div>
    <p class="hint" id="hint">시작을 누르면 마피아 2명이 여기에 뜹니다.</p>
  </section>

  <div class="actions">
    <button id="start" type="button">시작</button>
    <button id="hide" type="button" hidden>가리기</button>
  </div>
</main>

<script>
  const TOTAL = 7, MAFIA = 2, KEY = "mafia-draw-names-v1";
  const $ = id => document.getElementById(id);

  let saved = [];
  try { saved = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}

  const cards = [];
  for (let i = 0; i < TOTAL; i++) {
    const card = document.createElement("label");
    card.className = "player";
    card.innerHTML = '<span class="no">' + (i + 1) + '</span><input id="p' + i +
      '" type="text" maxlength="12" autocomplete="off"><span class="tag">마피아</span>';
    const input = card.querySelector("input");
    input.placeholder = (i + 1) + "번";
    input.value = saved[i] || "";
    input.addEventListener("input", () => {
      try { localStorage.setItem(KEY, JSON.stringify(cards.map(c => c.input.value))); } catch (e) {}
    });
    $("players").appendChild(card);
    cards.push({ card, input });
  }

  const nameOf = i => cards[i].input.value.trim() || (i + 1) + "번";

  function pick() {
    const idx = [...Array(TOTAL).keys()];
    for (let i = TOTAL - 1; i > 0; i--) {
      const r = new Uint32Array(1);
      crypto.getRandomValues(r);
      const j = r[0] % (i + 1);
      [idx[i], idx[j]] = [idx[j], idx[i]];
    }
    return idx.slice(0, MAFIA).sort((a, b) => a - b);
  }

  function clear() {
    cards.forEach(c => c.card.classList.remove("mafia", "flash"));
    $("stage").classList.remove("shown");
    $("names").hidden = true;
    $("hint").hidden = false;
    $("hide").hidden = true;
  }

  function reveal(mafia) {
    cards.forEach(c => c.card.classList.remove("flash"));
    mafia.forEach(i => cards[i].card.classList.add("mafia"));
    $("names").innerHTML = "";
    mafia.forEach(i => {
      const s = document.createElement("span");
      s.textContent = nameOf(i);
      $("names").appendChild(s);
    });
    $("stage").classList.add("shown");
    $("label").textContent = "오늘 밤의 마피아";
    $("names").hidden = false;
    $("hint").hidden = true;
    $("hide").hidden = false;
    $("start").disabled = false;
    $("start").textContent = "다시 뽑기";
  }

  $("start").addEventListener("click", () => {
    clear();
    const mafia = pick();
    const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (still) return reveal(mafia);
    $("start").disabled = true;
    $("label").textContent = "뽑는 중";
    $("hint").textContent = "…";
    let n = 0;
    const t = setInterval(() => {
      cards.forEach(c => c.card.classList.remove("flash"));
      cards[Math.floor(Math.random() * TOTAL)].card.classList.add("flash");
      if (++n >= 14) { clearInterval(t); reveal(mafia); }
    }, 90);
  });

  $("hide").addEventListener("click", () => {
    clear();
    $("label").textContent = "가려짐";
    $("hint").textContent = "결과를 가렸습니다. 다시 뽑기를 누르면 새로 뽑습니다.";
  });
</script>
