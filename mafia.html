<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>마피아 게임</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* 레이아웃: 폰 한 화면 — 위에 방 정보, 가운데 지금 단계의 안내, 밤에는 마피아에게만 회의 창 */
  :root {
    color-scheme: dark;
    --night: #12131C;
    --panel: #1C1E2B;
    --line: #2E3144;
    --ink: #ECEAF2;
    --dim: #8E90A6;
    --blood: #D8324A;
    --blood-soft: #3A1620;
    --ok: #4CC392;
    --display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--night);
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.5;
    padding-block: max(20px, env(safe-area-inset-top, 0px)) 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  h1 { font-family: var(--display); font-weight: 400; font-size: 30px; margin: 0; letter-spacing: 0.02em; }
  h2 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0; }
  p { margin: 0; }
  .dim { color: var(--dim); font-size: 13px; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .card.red { border-color: var(--blood); background: var(--blood-soft); }

  input[type=text], input[type=tel] {
    width: 100%; min-width: 0;
    background: var(--night); color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px;
    font: inherit; padding: 12px;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  button {
    font: inherit; font-weight: 700; cursor: pointer;
    border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink);
    padding: 12px 16px;
    -webkit-tap-highlight-color: transparent;
  }
  button.primary { background: var(--blood); border-color: var(--blood); color: #fff; }
  button.big { font-family: var(--display); font-weight: 400; font-size: 22px; letter-spacing: 0.05em; padding: 16px; width: 100%; }
  button.small { padding: 6px 10px; font-size: 13px; font-weight: 500; }
  button:disabled { opacity: .45; cursor: default; }
  label.check { display: flex; gap: 8px; align-items: center; color: var(--dim); font-size: 14px; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .code { font-family: var(--display); font-size: 20px; letter-spacing: 0.12em; font-variant-numeric: tabular-nums; }
  .status { font-size: 12px; color: var(--dim); }
  .status.on::before { content: "● "; color: var(--ok); }
  .status.off::before { content: "● "; color: var(--blood); }
  .banner { border: 1px solid var(--blood); color: var(--ink); background: var(--blood-soft); border-radius: 10px; padding: 10px 12px; font-size: 13px; }

  .phase { font-size: 13px; letter-spacing: 0.12em; color: var(--dim); }
  .headline { font-family: var(--display); font-size: 34px; line-height: 1.2; overflow-wrap: anywhere; }
  .headline em { font-style: normal; color: var(--blood); }

  ul.players { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  ul.players li {
    display: flex; align-items: center; justify-content: space-between; gap: 6px; min-width: 0;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  }
  ul.players li .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  ul.players li.dead { opacity: .5; }
  ul.players li.dead .nm { text-decoration: line-through; }
  ul.players li.maf { border-color: var(--blood); }
  .tag { flex: none; font-size: 11px; font-weight: 700; color: var(--dim); }
  .tag.red { color: var(--blood); }
  .tag.ok, .headline em.ok { color: var(--ok); }

  .choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .choices button { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .choices button.sel { border-color: var(--blood); background: var(--blood-soft); }

  #log {
    height: 220px; overflow-y: auto;
    background: var(--night); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 14px;
  }
  #log .who { color: var(--blood); font-weight: 700; margin-right: 6px; }
  #log .sys { color: var(--dim); font-size: 13px; }
  #log .msg { overflow-wrap: anywhere; }
  #chatForm { display: flex; gap: 8px; }
  #chatForm button { flex: none; }
  .link { font-size: 12px; color: var(--dim); overflow-wrap: anywhere; user-select: all; }
</style>
</head>
<body>
<main>
  <!-- 첫 화면: 방 만들기 / 참가 -->
  <section id="home" class="col">
    <h1>마피아 게임</h1>
    <p class="dim">7명이 각자 폰으로 접속합니다. 마피아 2명, 의사 1명. 밤에는 마피아끼리 회의해서 한 명을 정하고 의사는 한 명을 살립니다. 결과는 모두의 화면에 뜹니다.</p>
    <div class="card col">
      <label for="name">닉네임</label>
      <input id="name" type="text" maxlength="10" placeholder="게임에서 쓸 닉네임" autocomplete="off">
    </div>
    <div class="card col">
      <h2>방 참가</h2>
      <div class="row">
        <input id="joinCode" type="tel" inputmode="numeric" maxlength="5" placeholder="방 번호 5자리" autocomplete="off">
        <button id="joinBtn" class="primary" type="button" style="flex:none">참가</button>
      </div>
    </div>
    <div class="card col">
      <h2>방 만들기</h2>
      <label class="check"><input id="modOnly" type="checkbox"> 나는 사회자만 한다 (게임에는 참가 안 함)</label>
      <button id="createBtn" type="button">새 방 만들기</button>
    </div>
    <p id="homeMsg" class="banner" hidden></p>
  </section>

  <!-- 게임 화면 -->
  <section id="room" class="col" hidden>
    <div class="top">
      <div>
        <div class="dim">방 번호</div>
        <div class="code" id="roomCode"></div>
      </div>
      <div class="row">
        <span id="conn" class="status off">연결 중</span>
        <button id="leaveBtn" class="small" type="button">나가기</button>
      </div>
    </div>
    <p id="banner" class="banner" hidden></p>
    <div id="view" class="col"></div>

    <section id="mafia" class="card red col" hidden>
      <h2>마피아 회의</h2>
      <div id="log" aria-live="polite"></div>
      <form id="chatForm">
        <input id="chatInput" type="text" maxlength="200" placeholder="마피아끼리만 보입니다" autocomplete="off">
        <button class="primary" type="submit">보내기</button>
      </form>
    </section>
  </section>
</main>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
(() => {
  "use strict";
  const MAX = 7, MIN = 5, MAFIA = 2;
  const qs = new URLSearchParams(location.search);
  // 무료 공개 중계 서버. 방 번호 첫 자리가 어느 서버인지 가리킨다.
  const BROKERS = qs.get("broker") ? [qs.get("broker")] : [
    "wss://broker.emqx.io:8084/mqtt",
    "wss://broker.hivemq.com:8884/mqtt",
    "wss://test.mosquitto.org:8081/mqtt",
  ];
  const PREFIX = "mafia7-2026jp/";
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const rand = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => "abcdefghjkmnpqrstuvwxyz23456789"[b % 31]).join("");
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  };

  let client = null, base = "", me = null;   // me: {room, id, key, name, isHost}
  let pub = null;        // 방장이 뿌리는 공개 상태
  let role = null;       // 내 역할 {game, role, mates, mkey}
  let H = null;          // 방장만 가지는 전체 상태
  let chat = [], picks = {}, picksFor = "";
  let curM = null, joined = false, kicked = false, connected = false;
  let healed = null, lastStateAt = 0, sel = null, execSel = null, lastKey = "", timers = [];

  /* ---------- 연결 ---------- */
  function connect(url) {
    return new Promise((resolve, reject) => {
      const c = mqtt.connect(url, { clientId: "mf_" + rand(10), clean: true, reconnectPeriod: 2000, connectTimeout: 8000, keepalive: 30 });
      const t = setTimeout(() => { c.end(true); reject(new Error("timeout")); }, 9000);
      c.once("connect", () => { clearTimeout(t); resolve(c); });
    });
  }
  const send = (topic, obj, retain) => client && client.publish(topic, obj === "" ? "" : JSON.stringify(obj), { qos: 1, retain: !!retain });
  function subM(mkey) {
    if (curM === mkey) return;
    if (curM) client.unsubscribe(base + "/m/" + curM);
    curM = mkey;
    if (mkey) client.subscribe(base + "/m/" + mkey, { qos: 1 });
  }

  async function enter(session, c) {
    me = session;
    store.set("mafia-session", me);
    base = PREFIX + me.room;
    try {
      client = c || await connect(BROKERS[(+me.room[0] || 1) - 1] || BROKERS[0]);
    } catch (e) {
      return home("서버에 연결하지 못했습니다. 인터넷 연결을 확인하고 다시 시도하세요.");
    }
    connected = true;
    client.on("connect", () => { connected = true; hello(); render(); });
    client.on("close", () => { connected = false; render(); });
    client.on("message", onMessage);
    client.subscribe([base + "/state", base + "/p/" + me.key], { qos: 1 });
    if (me.isHost) {
      client.subscribe(base + "/host", { qos: 1 });
      if (H.mkey) subM(H.mkey);
      hostPublish(); sendRoles();
      timers.push(setInterval(hostPublish, 5000));
    }
    hello();
    timers.push(setInterval(tick, 3000));
    try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch (e) {}
    history.replaceState(null, "", "#" + me.room);
    $("home").hidden = true; $("room").hidden = false;
    $("roomCode").textContent = me.room;
    lastStateAt = Date.now();
    render();
  }
  function hello() { if (!me.isHost) send(base + "/host", { t: "hello", id: me.id, key: me.key }); }
  function tick() {
    if (!me.isHost && !kicked && pub && pub.phase === "lobby" && !inGame()) {
      send(base + "/host", { t: "join", id: me.id, key: me.key, name: me.name });
    }
    render();
  }
  function home(msg) {
    timers.forEach(clearInterval); timers = [];
    if (client) { client.end(true); client = null; }
    store.del("mafia-session");
    me = pub = role = H = null; chat = []; picks = {}; curM = null; joined = kicked = false; lastKey = "";
    history.replaceState(null, "", location.pathname + location.search);
    $("room").hidden = true; $("home").hidden = false;
    $("homeMsg").hidden = !msg; $("homeMsg").textContent = msg || "";
  }

  /* ---------- 수신 ---------- */
  function onMessage(topic, payload) {
    const txt = payload.toString();
    let m = null;
    if (txt) { try { m = JSON.parse(txt); } catch (e) { return; } }
    if (topic === base + "/state") {
      if (!m) { if (!me.isHost) home("방장이 방을 닫았습니다."); return; }
      if (me.isHost && m.hostId !== me.id) return;
      const prevGame = pub && pub.game;
      pub = m; lastStateAt = Date.now();
      if (prevGame !== pub.game) { chat = []; sel = execSel = null; $("log").innerHTML = ""; }
      const k = pub.game + ":" + pub.round;
      if (picksFor !== k) { picksFor = k; picks = {}; sel = execSel = healed = null; }
      if (inGame()) joined = true;
      else if (joined && pub.phase === "lobby" && !me.isHost) { joined = false; kicked = true; }
      render();
    } else if (topic === base + "/p/" + me.key) {
      role = m;
      if (!me.isHost) subM(m && m.role === "mafia" ? m.mkey : null);
      render();
    } else if (topic === base + "/host") {
      if (me.isHost && m) hostOn(m);
    } else if (curM && topic === base + "/m/" + curM && m) {
      if (m.t === "chat") addChat(m);
      if (m.t === "pick" && pub && m.round === pub.round) {
        picks[m.from] = m.target;
        addChat({ sys: nameOf(m.from) + " → " + nameOf(m.target) + " 지목" });
        if (me.isHost) hostPick(m);
        render();
      }
    }
  }
  const inGame = () => !!(pub && pub.players.some(p => p.id === me.id));
  const nameOf = id => { const p = pub && pub.players.find(p => p.id === id); return p ? p.name : "?"; };
  const myRole = () => (role && pub && role.game === pub.game ? role.role : null);
  const isMod = () => me.isHost && pub && !pub.hostPlays;

  function addChat(m) {
    chat.push(m);
    const d = document.createElement("div");
    if (m.sys) { d.className = "sys"; d.textContent = m.sys; }
    else {
      d.className = "msg";
      const w = document.createElement("span"); w.className = "who"; w.textContent = nameOf(m.from);
      d.append(w, document.createTextNode(m.text));
    }
    $("log").append(d);
    $("log").scrollTop = $("log").scrollHeight;
  }

  /* ---------- 방장 로직 ---------- */
  function hostPublish() {
    if (!H) return;
    store.set("mafia-host-" + me.room, H);
    const s = {
      game: H.game, phase: H.phase, round: H.round, hostId: me.id, hostPlays: H.hostPlays,
      players: H.players.map(p => ({ id: p.id, name: p.name, alive: p.alive })),
      lastKilled: H.lastKilled, lastExecuted: H.lastExecuted, winner: H.winner, ts: Date.now(),
    };
    if (H.phase === "end") s.roles = Object.fromEntries(H.players.map(p => [p.id, p.role]));
    send(base + "/state", s, true);
  }
  function sendRole(p) {
    const maf = p.role === "mafia";
    send(base + "/p/" + p.key, {
      game: H.game, role: p.role || null,
      mates: maf ? H.players.filter(q => q.role === "mafia" && q.id !== p.id).map(q => q.id) : [],
      mkey: maf ? H.mkey : null,
    }, true);
  }
  const sendRoles = () => H.players.forEach(sendRole);
  function hostOn(m) {
    const p = H.players.find(p => p.id === m.id);
    if (m.t === "hello") { hostPublish(); if (p && p.key === m.key) sendRole(p); }
    if (m.t === "save" && p && p.key === m.key && p.role === "doctor" && p.alive && H.phase === "night" && m.round === H.round) {
      const t = H.players.find(q => q.id === m.target);
      if (t && t.alive) { H.save = t.id; hostResolve(); }
    }
    if (m.t === "join" && H.phase === "lobby") {
      const name = String(m.name || "").trim().slice(0, 10) || "닉네임없음";
      if (p) { if (p.key === m.key) p.name = name; }
      else if (H.players.length < MAX) H.players.push({ id: String(m.id), key: String(m.key), name, alive: true, role: null });
      hostPublish();
    }
  }
  function hostStart() {
    const n = H.players.length;
    if (n < MIN || n > MAX) return;
    const idx = H.players.map((_, i) => i);
    for (let i = n - 1; i > 0; i--) {
      const j = crypto.getRandomValues(new Uint32Array(1))[0] % (i + 1);
      [idx[i], idx[j]] = [idx[j], idx[i]];
    }
    H.players.forEach((p, i) => { p.alive = true; const r = idx.indexOf(i); p.role = r < MAFIA ? "mafia" : r === MAFIA ? "doctor" : "citizen"; });
    Object.assign(H, { game: H.game + 1, mkey: rand(16), phase: "night", round: 1, picks: {}, kill: null, save: null, lastKilled: null, lastExecuted: null, winner: null });
    subM(H.mkey);
    sendRoles(); hostPublish();
  }
  function hostWin() {
    const m = H.players.filter(p => p.alive && p.role === "mafia").length;
    const c = H.players.filter(p => p.alive && p.role !== "mafia").length;
    H.winner = m === 0 ? "citizen" : m >= c ? "mafia" : null;
    if (H.winner) H.phase = "end";
    return !!H.winner;
  }
  function hostPick(m) {
    if (H.phase !== "night" || m.round !== H.round || H.kill) return;
    const from = H.players.find(p => p.id === m.from), target = H.players.find(p => p.id === m.target);
    if (!from || !target || !from.alive || from.role !== "mafia" || !target.alive || target.role === "mafia") return;
    H.picks[from.id] = target.id;
    const alive = H.players.filter(p => p.alive && p.role === "mafia");
    if (!alive.every(p => H.picks[p.id] === target.id)) return;
    H.kill = target.id;
    hostResolve();
  }
  // 마피아의 결정과 (살아 있다면) 의사의 선택이 모두 모이면 밤이 끝난다
  function hostResolve() {
    if (H.phase !== "night" || !H.kill) return;
    if (H.players.some(p => p.alive && p.role === "doctor") && !H.save) return;
    if (H.save === H.kill) H.lastKilled = "none";
    else { H.players.find(p => p.id === H.kill).alive = false; H.lastKilled = H.kill; }
    H.kill = H.save = null; H.picks = {};
    if (!hostWin()) H.phase = "day";
    hostPublish();
  }
  function hostExecute(id) {
    if (H.phase !== "day") return;
    const p = id && H.players.find(p => p.id === id);
    if (p) p.alive = false;
    H.lastExecuted = p ? p.id : "none";
    if (!hostWin()) { H.phase = "night"; H.round++; H.picks = {}; H.kill = H.save = null; }
    hostPublish();
  }
  function hostNewGame() {
    H.players.forEach(p => { p.alive = true; p.role = null; });
    Object.assign(H, { game: H.game + 1, phase: "lobby", round: 0, mkey: null, picks: {}, kill: null, save: null, lastKilled: null, lastExecuted: null, winner: null });
    subM(null);
    sendRoles(); hostPublish();
  }

  /* ---------- 화면 ---------- */
  function playerList(opts = {}) {
    return '<ul class="players">' + pub.players.map(p => {
      const maf = opts.roles && opts.roles[p.id] === "mafia";
      const tags = [];
      if (p.id === me.id) tags.push('<span class="tag">나</span>');
      if (p.id === pub.hostId) tags.push('<span class="tag">방장</span>');
      if (maf) tags.push('<span class="tag red">마피아</span>');
      if (opts.roles && opts.roles[p.id] === "doctor") tags.push('<span class="tag ok">의사</span>');
      if (!p.alive) tags.push('<span class="tag">사망</span>');
      if (opts.kick && p.id !== me.id) tags.push('<button class="small" data-act="kick" data-id="' + esc(p.id) + '" type="button">내보내기</button>');
      return '<li class="' + (p.alive ? "" : "dead ") + (maf ? "maf" : "") + '"><span class="nm">' + esc(p.name) + "</span>" + tags.join("") + "</li>";
    }).join("") + "</ul>";
  }
  function choices(list, cur, act) {
    return '<div class="choices">' + list.map(p =>
      '<button type="button" class="' + (cur === p.id ? "sel" : "") + '" data-act="' + act + '" data-id="' + esc(p.id) + '">' + esc(p.name) + "</button>").join("") + "</div>";
  }

  function render() {
    if (!me) return;
    const stale = !me.isHost && pub && Date.now() - lastStateAt > 16000;
    const noRoom = !me.isHost && !pub && Date.now() - lastStateAt > 7000;
    const key = JSON.stringify([pub && { ...pub, ts: 0 }, role, sel, execSel, healed, connected, stale, noRoom, kicked, picks]);
    if (key === lastKey) return;
    lastKey = key;

    $("conn").className = "status " + (connected ? "on" : "off");
    $("conn").textContent = connected ? "연결됨" : "재연결 중";
    const banner = stale ? "방장과 연결이 끊겼습니다. 방장 폰의 화면이 켜져 있어야 게임이 진행됩니다."
      : noRoom ? "이 번호의 방을 찾지 못했습니다. 방 번호를 확인하세요." : "";
    $("banner").hidden = !banner; $("banner").textContent = banner;

    const v = $("view");
    const mine = pub ? myRole() : null;
    const showChat = !!pub && pub.phase === "night" && (mine === "mafia" || isMod());
    $("mafia").hidden = !showChat;
    if (!pub) { v.innerHTML = '<p class="dim">방에 연결하는 중…</p>'; return; }

    const meP = pub.players.find(p => p.id === me.id);
    const alive = pub.players.filter(p => p.alive);
    const canChat = mine === "mafia" && meP && meP.alive;
    $("chatInput").disabled = !canChat;
    $("chatForm").hidden = !canChat;
    let h = "";

    if (kicked) {
      h = '<div class="card col"><p>방에서 나왔습니다.</p><button data-act="rejoin" type="button">다시 참가</button></div>';
    } else if (!meP && !isMod() && pub.phase !== "lobby") {
      h = '<div class="card"><p>이미 게임이 진행 중입니다. 이번 판이 끝나면 자동으로 참가합니다.</p></div>';
    } else if (pub.phase === "lobby") {
      const n = pub.players.length;
      h = '<div class="col"><span class="phase">대기실</span><div class="headline">' + n + " / " + MAX + "명</div></div>" + playerList({ kick: me.isHost });
      if (me.isHost) {
        h += '<button class="primary big" data-act="start" type="button"' + (n < MIN ? " disabled" : "") + ">시작</button>" +
          '<p class="dim">' + (n < MIN ? "마피아 2명으로 하려면 최소 " + MIN + "명이 필요합니다. " : "") +
          "친구들에게 방 번호 <b>" + esc(me.room) + "</b> 또는 아래 주소를 알려 주세요. 방장 폰은 게임 내내 이 화면을 켜 두어야 합니다.</p>" +
          '<p class="link">' + esc(location.origin + location.pathname + "#" + me.room) + "</p>";
      } else {
        h += '<p class="dim">' + (meP ? "방장이 시작하기를 기다리는 중입니다." : "참가하는 중…") + "</p>";
      }
    } else if (pub.phase === "night") {
      h = '<div class="col"><span class="phase">' + pub.round + "번째 밤</span>";
      if (pub.round > 1) h += '<p class="dim">낮 투표 결과: ' + (pub.lastExecuted === "none" ? "처형 없음" : esc(nameOf(pub.lastExecuted)) + " 처형") + "</p>";
      if (isMod()) {
        const maf = H.players.filter(p => p.role === "mafia");
        h += '<div class="headline">마피아는 <em>' + maf.map(p => esc(p.name)).join(", ") + "</em></div><p>의사: <b>" + H.players.filter(p => p.role === "doctor").map(p => esc(p.name)).join(", ") + "</b></p></div>" +
          '<p class="dim">마피아가 같은 사람을 확정하고 의사가 살릴 사람을 고르면 낮으로 넘어갑니다.</p>' +
          playerList({ roles: Object.fromEntries(H.players.map(p => [p.id, p.role])) });
      } else if (mine === "mafia") {
        const mates = (role.mates || []).map(nameOf).map(esc).join(", ");
        h += '<div class="headline">당신은 <em>마피아</em>입니다</div><p>동료 마피아: <b>' + (mates || "없음") + "</b></p></div>";
        if (meP.alive) {
          const targets = alive.filter(p => p.id !== me.id && !(role.mates || []).includes(p.id));
          h += '<div class="card col"><p>오늘 밤 죽일 사람</p>' + choices(targets, sel, "sel") +
            '<button class="primary" data-act="pick" type="button"' + (sel ? "" : " disabled") + ">이 사람으로 확정</button>" +
            '<p class="dim">' + (picks[me.id] ? "내 지목: " + esc(nameOf(picks[me.id])) + ". " : "") +
            "살아 있는 마피아가 모두 같은 사람을 확정하면 결정됩니다. 의사가 그 사람을 살리면 아무도 죽지 않습니다.</p></div>";
        } else {
          h += '<p class="dim">당신은 사망했습니다. 회의는 볼 수만 있습니다.</p>';
        }
      } else if (mine === "doctor") {
        h += '<div class="headline">당신은 <em class="ok">의사</em>입니다</div></div>';
        if (meP.alive) {
          h += '<div class="card col"><p>오늘 밤 살릴 사람 (나 자신도 가능)</p>' + choices(alive, sel, "sel") +
            '<button class="primary" data-act="save" type="button"' + (sel ? "" : " disabled") + ">이 사람을 살린다</button>" +
            '<p class="dim">' + (healed ? "선택 완료: " + esc(nameOf(healed)) + ". 밤이 끝나기 전까지 바꿀 수 있습니다." : "마피아가 고른 사람과 같으면 그 사람은 죽지 않습니다. 선택해야 밤이 끝납니다.") + "</p></div>";
        } else {
          h += '<p class="dim">당신은 사망했습니다. 조용히 지켜보세요.</p>' + playerList();
        }
      } else {
        h += '<div class="headline">당신은 시민입니다</div></div>' +
          '<p class="dim">' + (meP.alive ? "밤입니다. 마피아가 회의 중입니다. 결과가 나오면 이 화면에 뜹니다." : "당신은 사망했습니다. 조용히 지켜보세요.") + "</p>" +
          playerList();
      }
    } else if (pub.phase === "day") {
      h = '<div class="col"><span class="phase">' + pub.round + "번째 낮</span>" +
        '<div class="headline">' + (pub.lastKilled === "none" ? "지난 밤 <em class=\"ok\">아무도 죽지 않았습니다</em>"
          : "지난 밤 <em>" + esc(nameOf(pub.lastKilled)) + "</em> 님이 죽었습니다") + "</div></div>" +
        (pub.lastKilled === "none" ? '<p class="dim">의사가 마피아의 표적을 살렸습니다.</p>' : "") +
        '<p class="dim">누가 마피아인지 토론하고 투표하세요.</p>' + playerList();
      if (me.isHost) {
        h += '<div class="card col"><p>투표 결과 입력 (방장)</p>' + choices(alive, execSel, "exec") +
          '<div class="row"><button class="primary" data-act="execute" type="button" style="flex:1"' + (execSel ? "" : " disabled") + ">처형하고 밤으로</button>" +
          '<button data-act="skip" type="button" style="flex:1">처형 없이 밤으로</button></div></div>';
      }
    } else if (pub.phase === "end") {
      h = '<div class="col"><span class="phase">게임 종료</span><div class="headline">' +
        (pub.winner === "mafia" ? "<em>마피아</em> 승리" : "시민 승리") + "</div></div>" + playerList({ roles: pub.roles || {} });
      h += me.isHost ? '<button class="primary big" data-act="new" type="button">새 게임</button>'
        : '<p class="dim">방장이 새 게임을 열기를 기다리는 중입니다.</p>';
    }
    v.innerHTML = h;
  }

  $("view").addEventListener("click", e => {
    const b = e.target.closest("[data-act]");
    if (!b || b.disabled) return;
    const act = b.dataset.act, id = b.dataset.id;
    if (act === "sel") { sel = id; render(); }
    else if (act === "exec") { execSel = execSel === id ? null : id; render(); }
    else if (act === "pick" && sel && curM) send(base + "/m/" + curM, { t: "pick", from: me.id, target: sel, round: pub.round });
    else if (act === "save" && sel) { send(base + "/host", { t: "save", id: me.id, key: me.key, target: sel, round: pub.round }); healed = sel; render(); }
    else if (act === "rejoin") { kicked = false; tick(); }
    else if (!me.isHost) return;
    else if (act === "start") hostStart();
    else if (act === "kick") { H.players = H.players.filter(p => p.id !== id); hostPublish(); }
    else if (act === "execute" && execSel) hostExecute(execSel);
    else if (act === "skip") hostExecute(null);
    else if (act === "new") hostNewGame();
  });
  $("chatForm").addEventListener("submit", e => {
    e.preventDefault();
    const text = $("chatInput").value.trim();
    if (!text || !curM || myRole() !== "mafia") return;
    send(base + "/m/" + curM, { t: "chat", from: me.id, text: text.slice(0, 200) });
    $("chatInput").value = "";
  });
  $("leaveBtn").addEventListener("click", () => {
    if (me.isHost) {
      if (!confirm("방장이 나가면 방이 닫힙니다. 닫을까요?")) return;
      send(base + "/state", "", true);
      store.del("mafia-host-" + me.room);
      setTimeout(() => home(), 300);
    } else if (confirm("방에서 나갈까요?")) home();
  });

  /* ---------- 첫 화면 ---------- */
  function myName() {
    const n = $("name").value.trim().slice(0, 10);
    if (!n) { $("homeMsg").hidden = false; $("homeMsg").textContent = "닉네임을 먼저 입력하세요."; $("name").focus(); return null; }
    store.set("mafia-name", n);
    return n;
  }
  $("joinBtn").addEventListener("click", () => {
    const name = myName(); if (!name) return;
    const code = $("joinCode").value.replace(/\D/g, "");
    if (code.length !== 5) { $("homeMsg").hidden = false; $("homeMsg").textContent = "방 번호 5자리를 입력하세요."; return; }
    $("homeMsg").hidden = true;
    enter({ room: code, id: rand(6), key: rand(16), name, isHost: false });
  });
  $("createBtn").addEventListener("click", async () => {
    const name = myName(); if (!name) return;
    $("createBtn").disabled = true; $("homeMsg").hidden = true;
    let c = null, bi = 0;
    for (; bi < BROKERS.length && !c; bi++) { try { c = await connect(BROKERS[bi]); } catch (e) {} }
    $("createBtn").disabled = false;
    if (!c) { $("homeMsg").hidden = false; $("homeMsg").textContent = "서버에 연결하지 못했습니다. 인터넷 연결을 확인하고 다시 시도하세요."; return; }
    const room = bi + String(crypto.getRandomValues(new Uint16Array(1))[0] % 10000).padStart(4, "0");
    const s = { room, id: rand(6), key: rand(16), name, isHost: true };
    const plays = !$("modOnly").checked;
    H = {
      game: 1, phase: "lobby", round: 0, hostPlays: plays, mkey: null, picks: {}, lastKilled: null, lastExecuted: null, winner: null,
      players: plays ? [{ id: s.id, key: s.key, name, alive: true, role: null }] : [],
    };
    enter(s, c);
  });

  $("name").value = store.get("mafia-name") || "";
  const hashCode = location.hash.replace(/\D/g, "");
  const saved = store.get("mafia-session");
  if (saved && saved.room && (!hashCode || hashCode === saved.room)) {
    if (saved.isHost) H = store.get("mafia-host-" + saved.room);
    if (!saved.isHost || H) { joined = false; enter(saved); }
    else store.del("mafia-session");
  } else if (hashCode) {
    $("joinCode").value = hashCode.slice(0, 5);
  }
})();
</script>
</body>
</html>
